name: Query Supabase

on:
  repository_dispatch:
    types: [query-item]

permissions:
  contents: write

jobs:
  query-item:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query Supabase and write result to file
        uses: actions/github-script@v7
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        with:
          script: |
            const fs = require('fs');
            const table = context.payload.client_payload.table;
            const queryString = context.payload.client_payload.query || '';
            const url = `${process.env.SUPABASE_URL}/rest/v1/${table}?${queryString}`;
            const res = await fetch(url, {
              headers: {
                'apikey': process.env.SUPABASE_KEY,
                'Authorization': `Bearer ${process.env.SUPABASE_KEY}`,
              }
            });
            const result = await res.text();
            fs.writeFileSync('query_result.json', result);
      - name: Commit result file
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add query_result.json
          git commit -m "Update query result" || echo "No changes"
          git push
