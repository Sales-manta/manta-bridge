name: Query Supabase

on:
  repository_dispatch:
    types: [query-item]

jobs:
  query-item:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase and output result
        uses: actions/github-script@v7
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        with:
          script: |
            const table = context.payload.client_payload.table;
            const queryString = context.payload.client_payload.query || '';
            const url = `${process.env.SUPABASE_URL}/rest/v1/${table}?${queryString}`;
            const res = await fetch(url, {
              headers: {
                'apikey': process.env.SUPABASE_KEY,
                'Authorization': `Bearer ${process.env.SUPABASE_KEY}`,
              }
            });
            const result = await res.json();
            console.log('QUERY_RESULT_START');
            console.log(JSON.stringify(result));
            console.log('QUERY_RESULT_END');
