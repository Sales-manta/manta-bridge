name: Add Item to Supabase

on:
  repository_dispatch:
    types: [add-item]

jobs:
  add-item:
    runs-on: ubuntu-latest
    steps:
      - name: Insert into Supabase
        uses: actions/github-script@v7
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        with:
          script: |
            const table = context.payload.client_payload.table;
            const data = context.payload.client_payload.data;
            const url = `${process.env.SUPABASE_URL}/rest/v1/${table}`;
            const res = await fetch(url, {
              method: 'POST',
              headers: {
                'apikey': process.env.SUPABASE_KEY,
                'Authorization': `Bearer ${process.env.SUPABASE_KEY}`,
                'Content-Type': 'application/json',
                'Prefer': 'return=representation'
              },
              body: JSON.stringify(data)
            });
            const result = await res.json();
            console.log('Result:', JSON.stringify(result));
            if (!res.ok) throw new Error(`Supabase error: ${JSON.stringify(result)}`);
