name: Add Item to Supabase

on:
  repository_dispatch:
    types: [add-item, update-item]

jobs:
  add-item:
    runs-on: ubuntu-latest
    steps:
      - name: Insert or Update in Supabase
        uses: actions/github-script@v7
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        with:
          script: |
            const table = context.payload.client_payload.table;
            const data = context.payload.client_payload.data;
            const recordId = context.payload.client_payload.id;
            const isUpdate = context.payload.action === 'update-item';
            const url = isUpdate
              ? `${process.env.SUPABASE_URL}/rest/v1/${table}?id=eq.${recordId}`
              : `${process.env.SUPABASE_URL}/rest/v1/${table}`;
            const method = isUpdate ? 'PATCH' : 'POST';
            console.log('URL:', url);
            console.log('Method:', method);
            console.log('Data:', JSON.stringify(data));
            console.log('SUPABASE_URL set:', !!process.env.SUPABASE_URL);
            console.log('SUPABASE_KEY set:', !!process.env.SUPABASE_KEY);
            console.log('SUPABASE_KEY length:', process.env.SUPABASE_KEY?.length);
            const res = await fetch(url, {
              method,
              headers: {
                'apikey': process.env.SUPABASE_KEY,
                'Authorization': `Bearer ${process.env.SUPABASE_KEY}`,
                'Content-Type': 'application/json',
                'Prefer': 'return=representation'
              },
              body: JSON.stringify(data)
            });
            const text = await res.text();
            console.log('Status:', res.status);
            console.log('Response:', text);
            if (!res.ok) throw new Error(`Supabase error ${res.status}: ${text}`);
